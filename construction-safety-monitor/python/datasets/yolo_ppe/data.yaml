# Auto-generated by tools/build_yolo_dataset.py - merges multiple public
# PPE detection datasets into one shared class space. Re-run that script
# (with a different --dataset/--source-dir) to add more sources; this file
# is overwritten each time to keep the class list authoritative.
# Deliberately no 'path:' key - this dataset gets zipped up and moved
# between machines (e.g. to Colab for GPU training). An absolute path
# here would silently break elsewhere, and - less obviously - ultralytics
# resolves a *relative* 'path:' (even 'path: .') against the current
# working directory the training script happens to be run from, not
# against this file's own directory - also wrong the moment training
# isn't launched from exactly this folder. Omitting 'path:' entirely
# makes ultralytics fall back to resolving train/val relative to wherever
# this data.yaml itself actually lives, which is the one thing that's
# always true no matter the machine or cwd.
train: images/train
val: images/val
names:
  0: person
  1: helmet
  2: vest
  3: gloves
  4: boots
  5: mask
